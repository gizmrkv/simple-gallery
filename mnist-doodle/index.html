<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手書き数字認識 - MNIST Doodle Predictor</title>
    <meta name="description" content="ブラウザ上で動作するMNIST手書き数字認識デモページです。ONNX Runtime Webを使用しています。" />
    <script src="./ort.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>手書き数字認識</h1>
        <p>キャンバスに数字（0〜9）を1つ描いて「予測する」ボタンを押してください。</p>
      </header>

      <main>
        <div class="canvas-container">
          <canvas id="canvas" width="280" height="280"></canvas>
          <div class="controls">
            <button id="predict-btn" class="primary-btn">予測する</button>
            <button id="clear-btn" class="secondary-btn">クリア</button>
          </div>
        </div>

        <div class="result-container">
          <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>推論中...</p>
          </div>
          
          <div id="result-display" class="hidden">
            <h2>予測結果: <span id="prediction">-</span></h2>
            <div id="confidence-list"></div>
          </div>

          <div id="error-message" class="error hidden"></div>
        </div>
      </main>

      <footer>
        <p>&copy; 2026 MNIST Doodle Predictor</p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
